name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # weekly check against the latest upstream gamescope Steam Deck LCD profile
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: ShellCheck
        run: shellcheck -S warning install-RefreshRateUnlocker.sh 70HzLCD.sh bootstrap.sh tests/run-tests.sh

      - name: End-to-end tests (latest gamescope profile)
        run: bash tests/run-tests.sh

      - name: Release asset matches RefreshRateUnlocker.desktop (Unix line endings)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/RefreshRateUnlocker.desktop -o release.desktop
          if grep -q $'\r' release.desktop; then echo "::error::Release asset has Windows (CRLF) line endings"; exit 1; fi
          cmp release.desktop RefreshRateUnlocker.desktop
